# Refresh the free data sources on a schedule, rebuild the app's data, and
# commit the result. Runs every Monday morning Melbourne time, whenever the
# data scripts change, and on demand from the Actions tab ("Run workflow").
name: Refresh data

on:
  schedule:
    - cron: '17 20 * * 0' # 20:17 UTC Sunday = early Monday in Melbourne
  push:
    branches: [main]
    paths:
      - 'scripts/fetch/**'
      - 'scripts/build-data/**'
      - 'data/real/**'
      - '.github/workflows/refresh-data.yml'
  workflow_dispatch:
    inputs:
      all:
        description: 'Refetch every source, ignoring cadence'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check parsers
        run: npm run test:fetch

      - name: Fetch sources
        id: fetch
        continue-on-error: true
        run: npm run fetch -- ${{ inputs.all && '--all' || '' }}

      - name: Build app data
        run: npm run data

      - name: Check the app still builds
        run: npm run build

      - name: Commit changes
        run: |
          git config user.name "good-patch-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/sources public/data
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Refresh data $(date -u +%Y-%m-%d)"
            # Code may have been pushed while this ran: rebase onto it before pushing.
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              sleep 10
            done
          fi

      - name: Report failed sources
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "One or more sources failed to update; the last good data was kept. See the job summary."
          exit 1
