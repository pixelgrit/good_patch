# Build the app and publish it to GitHub Pages (gh-pages branch) after every
# push to main and after each scheduled data refresh.
# Site: https://pixelgrit.github.io/good_patch/
name: Deploy site

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ['Refresh data']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build -- --base=/good_patch/

      - name: Publish to gh-pages
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "good-patch-deploy-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy $(git -C .. rev-parse --short HEAD)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
